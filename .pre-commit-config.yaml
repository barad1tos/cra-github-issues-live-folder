default_stages: [pre-commit, manual]

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-xml
        types: [text]
        files: '\.(svg|xml)$'
      - id: check-added-large-files
        args: [--maxkb=500, --enforce-all]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: zizmor
        name: Scan GitHub Actions with zizmor
        entry: uvx --from zizmor==1.32.0 zizmor --offline
        language: system
        files: '^\.github/(workflows/.*\.ya?ml|actions/.+/action\.ya?ml)$'

      - id: plugin-tests
        name: Test Cra plugin
        entry: npm test
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: '^(plugin/|scripts/|tests/|\.pre-commit-config\.yaml$|package(-lock)?\.json$|tsconfig\.json$)'
